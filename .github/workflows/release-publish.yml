name: Release Windows x64 EXE

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Beta]
      version:
        description: Version to release (e.g., 2.15.1-cn.1)
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ inputs.version }}
      CONFIGURATION: ${{ inputs.configuration }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select release source
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item docs/release-windows-x64.md "$env:RUNNER_TEMP/release-notes.md"
          $tag = "v$env:VERSION"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            # Repack existing releases from their exact application source.
            git checkout --detach $tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not check out release tag' }
          }
          [xml]$project = Get-Content PCL.Launcher/PCL.Launcher.csproj
          if ($project.Project.PropertyGroup.Version -ne $env:VERSION) {
            throw 'Requested version does not match the application version'
          }
          "SOURCE_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          $baseVersion = ($env:VERSION -split '-', 2)[0]
          "ASSET_NAME=PCL_CE_CN_$baseVersion.exe" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Test region policy and fork updates
        run: |
          dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c $env:CONFIGURATION -p:Platform=AnyCPU --filter 'FullyQualifiedName~RegionPolicyTest|FullyQualifiedName~ForkGitHubUpdateTest' --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Region policy or fork update tests failed' }

      - name: Publish self-contained single EXE
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          dotnet publish PCL.Launcher/PCL.Launcher.csproj -c $env:CONFIGURATION -r win-x64 -p:Platform=x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist/single-file
          if ($LASTEXITCODE -ne 0) { throw 'Single-file publish failed' }
          $files = @(Get-ChildItem dist/single-file -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'PCL.Launcher.exe') {
            $files | Select-Object FullName
            throw 'Expected a single EXE with all dependencies bundled'
          }
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          Copy-Item $files[0].FullName "dist/release/$env:ASSET_NAME"

      - name: Smoke test EXE in an empty directory
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:RUNNER_TEMP 'pcl-single-exe-smoke'
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          $exe = Join-Path $smoke $env:ASSET_NAME
          Copy-Item "dist/release/$env:ASSET_NAME" $exe
          $env:PCL_PATH = Join-Path $smoke 'data'
          $env:PCL_PATH_SHARED = Join-Path $smoke 'shared'
          $env:PCL_PATH_LOCAL = Join-Path $smoke 'local'
          $env:PCL_PATH_TEMP = Join-Path $smoke 'temp'
          $env:DOTNET_ROOT = Join-Path $smoke 'no-installed-runtime'
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $smoke 'bundle'
          $env:DOTNET_HOST_TRACE = '1'
          $env:DOTNET_HOST_TRACEFILE = Join-Path $smoke 'host-trace.log'
          $process = Start-Process -FilePath $exe -WorkingDirectory $smoke -WindowStyle Hidden -PassThru -RedirectStandardOutput "$smoke/stdout.log" -RedirectStandardError "$smoke/stderr.log"
          try {
            if (-not $process.WaitForInputIdle(45000)) { throw 'GUI did not become ready' }
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) { throw "EXE exited during startup: $($process.ExitCode)" }
            # Single-file hosts can link CoreCLR into the EXE instead of loading coreclr.dll.
            # Verify the loaded core library and application/native modules come from this bundle.
            $runtime = $process.Modules | Where-Object ModuleName -eq 'System.Private.CoreLib.dll' | Select-Object -First 1
            if (-not $runtime -or -not $runtime.FileName.StartsWith($env:DOTNET_BUNDLE_EXTRACT_BASE_DIR, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'EXE did not load its bundled .NET runtime'
            }
            foreach ($name in @('PCL.Launcher.dll', 'libSkiaSharp.dll', 'e_sqlite3.dll')) {
              $module = $process.Modules | Where-Object ModuleName -eq $name | Select-Object -First 1
              if (-not $module -or -not $module.FileName.StartsWith($env:DOTNET_BUNDLE_EXTRACT_BASE_DIR, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Required module was not loaded from the single EXE: $name"
              }
            }
            $fatal = Get-ChildItem $smoke -Filter '*.log' -Recurse | Select-String -Pattern '\[FTL!\]|UNCAUGHT EXCEPTION|Unhandled exception'
            if ($fatal) { $fatal | Write-Output; throw 'Fatal startup error detected' }
            Write-Output "Single EXE startup succeeded using bundled runtime: $($runtime.FileName)"
            Get-FileHash $exe -Algorithm SHA256
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-Content "$smoke/stderr.log" -ErrorAction SilentlyContinue
            if ($Error.Count -gt 0) {
              $process.Modules | Select-Object ModuleName, FileName | Format-Table -AutoSize | Out-String -Width 300 | Write-Output
              Get-Content "$smoke/host-trace.log" -Tail 15 -ErrorAction SilentlyContinue | ForEach-Object { $_.Substring(0, [Math]::Min($_.Length, 500)) }
            }
            Get-ChildItem "$smoke/data","$smoke/shared","$smoke/local","$smoke/temp" -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Output $_.FullName
              Get-Content $_.FullName -Tail 25
            }
          }

      - name: Upload verified EXE
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-x64-EXE
          path: dist/release/*.exe
          if-no-files-found: error

      - name: Publish only the Windows x64 EXE
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @('release', 'create', $tag, '--target', $env:SOURCE_SHA, '--title', "PCL CE CN $env:VERSION", '--notes-file', "$env:RUNNER_TEMP/release-notes.md", '--draft')
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $tag "dist/release/$env:ASSET_NAME" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'EXE upload failed' }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect release assets' }
          $exe = @($release.assets | Where-Object name -eq $env:ASSET_NAME)
          if ($exe.Count -ne 1 -or $exe[0].size -le 0) { throw 'Uploaded EXE is missing' }
          foreach ($asset in $release.assets | Where-Object name -ne $env:ASSET_NAME) {
            gh release delete-asset $tag $asset.name --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove old asset: $($asset.name)" }
          }
          $prerelease = if ($env:CONFIGURATION -eq 'Beta') { '--prerelease=true' } else { '--prerelease=false' }
          gh release edit $tag --title "PCL CE CN $env:VERSION" --notes-file "$env:RUNNER_TEMP/release-notes.md" --draft=false $prerelease --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
